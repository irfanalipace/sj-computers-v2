server {
    listen              80;

    server_name         localhost;

    access_log          /var/log/nginx/nginx.vhost.access.log;
    error_log           /var/log/nginx/nginx.vhost.error.log;

    
    location /api {
        proxy_set_header Host $http_host;
        proxy_pass         http://backend:80;
    }
    
    location / {
        proxy_pass         http://frontend:80;
    }

}